[package]
name = "patina"
description = "Knowledge that improves with age."
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Iwan van der Kleijn <iwanvanderkleijn@gmail.com>"]

[dependencies]
anyhow = "1.0"
camino = "1.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
