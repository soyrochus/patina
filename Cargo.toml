[package]
name = "patina"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first, Git-compatible Markdown knowledge tool for AI-assisted development."
license = "MIT"
authors = ["Iwan van der Kleijn <iwanvanderkleijn@gmail.com>"]
repository = "https://github.com/soyrochus/patina"
homepage = "https://github.com/soyrochus/patina"
documentation = "https://github.com/soyrochus/patina#readme"
readme = "README.md"
keywords = ["knowledge", "markdown", "cli", "ai", "rust"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".patina/",
  "target/",
  "dist/",
  ".github/",
  "*.log"
]

[[bin]]
name = "patina"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
camino = "1.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
pulldown-cmark = "0.12"
rusqlite = { version = "0.32", features = ["bundled-full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true